# ===========================================================================
#  gimbal_ctl.ini —— Windows 上位机配置（放在 gimbal_ctl.exe 同级目录）
#
#  用记事本改完直接保存，重新双击 exe 生效。
#  命令行参数优先级更高（临时试参数就用命令行，别改这个文件）。
#  井号开头是注释，留空/删掉的行 = 用默认值。
# ===========================================================================

# ---- 连哪台 Jetson --------------------------------------------------------
# 网线直连（笔记本 192.168.2.1 ↔ Jetson 192.168.2.2）：用下面这个
host=192.168.2.2
# 走 Jetson 热点 MECAR-CTRL：改成热点网关地址（Jetson 侧 10.42.0.1）
#host=10.42.0.1

# UDP 控制口（一般不用动）
ctrl_port=40001
# MJPEG 图传端口（一般不用动）
http_port=8080

# ---- 画面 ----------------------------------------------------------------
# 1 = 开视频，0 = 只看控制（无线带宽紧张时填 0）
video=1
# 窗口大小，宽x高
size=960x540

# ---- 手感 ----------------------------------------------------------------
# 方向键转云台的速度（度/秒）。想更"能打"就调大到 150~180
gimbal_rate=120
# 云台角速度上限（度/秒）
max_rate=180
# 平滑时间常数（秒），大一点更顺、更"肉"
tau=0.045
# 指令发送频率（Hz），一般别低于 100
hz=100

# ---- 底盘 ----------------------------------------------------------------
# 普通档：平移 mm/s、转向 mrad/s（1.5 rad/s = 1500）
chassis_speed=300
chassis_turn=1500
# 快速档（键盘 Shift 切换）：平移、转向
shift_speed=600
shift_turn=3000

# ---- 驾驶坐标系（重要：默认按枪口方向走）--------------------------------
# 1 = 按枪口方向驾驶：W/S 沿枪口指向前后，A/D 是枪口的左右侧（麦轮横移）
# 0 = 按车头方向驾驶：W = 车头朝前
gun_relative=1
# 枪口正对车头时的 yaw 角（度）。默认 0（机械零点就是正前）。
# 若零点不在机械位置：现场按 Y 键标定，把界面显示的 theta 归零后记下
# gun_offset 的等效值写到这里，下次开就不用再按。
gun_offset=0
# 验证：云台往左转 90°再按 W，车应"横着往左走"。若走到右前方（左右镜像），
# 说明转角符号反了，填 -1（A/D 会一起纠正）。
gun_sign=1

# ---- 小陀螺（键盘 R 切换）------------------------------------------------
# 自旋速率 0.001 rad/s。2000 = 2.0 rad/s ≈ 115°/s；填负值 = 反向自旋
spin_rate=2000
# yaw 反向补偿倍率。实机发现相机"转得更快"（补偿同向叠加）时改 -1
spin_gain=1.0
